services:
  postgres:
    image: postgres:18
    container_name: nesquik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
